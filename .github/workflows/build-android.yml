name: 仅构建Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 安装并切换 JDK 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head
          yes | sdkmanager --licenses || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.25.0" "qrcode[pil]>=7.4.2" "requests>=2.32.5" "urllib3>=2.0.0" "pillow>=10.0.0"

      - name: 构建 APK
        run: |
          export CI=true
          flet build apk --verbose

      - name: 准备产物
        shell: bash
        run: |
          mkdir -p release
          find build -name "*.apk" -exec cp {} release/ \; 2>/dev/null || true
          echo "[]" > release/xiaomiconfig.json
          ls -la release/
          APK=$(find release -name "*.apk" | head -1)
          cp "$APK" release/xiaomi-wallet-gui-fixed.apk
          ls -la release/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-wallet-gui-android
          path: release/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3-fixed
          name: 修复版 v1.2.3-fixed
          body: |
            修复了 gui.py 中与 main.py 不一致的任务接口实现：
            - completeTask 改用 GET + 完整参数
            - getTask 补充 jrairstar_ph 参数并修正 userTaskId 字段路径
            - reward 改用 luckDraw 接口
          files: release/xiaomi-wallet-gui-fixed.apk
          generate_release_notes: false
          force_create_release: true
